name: Nest Aryan Scraper

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "selenium==4.23.1" \
            "webdriver-manager==4.0.2" \
            "gspread==6.1.2" \
            "google-auth==2.35.0" \
            "python-dotenv==1.0.1"

      - name: Write credentials.json
        run: echo "${{ secrets.GSHEET_SERVICE_JSON }}" > credentials.json

      - name: Run scraper (with internal retries)
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          RUN_CONTEXT: "GITHUB"
        run: python scraper.py

  scrape-retry:
    needs: scrape
    runs-on: ubuntu-latest
    if: needs.scrape.result != 'success'
    timeout-minutes: 12

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "selenium==4.23.1" \
            "webdriver-manager==4.0.2" \
            "gspread==6.1.2" \
            "google-auth==2.35.0" \
            "python-dotenv==1.0.1"

      - name: Write credentials.json
        run: echo "${{ secrets.GSHEET_SERVICE_JSON }}" > credentials.json

      - name: Run scraper (retry, still with internal retries)
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          RUN_CONTEXT: "GITHUB"
        run: python scraper.py
